<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="610"><rect width="1500" height="610" fill="#f5f8f3"/><style>text{font-family:Arial,sans-serif;fill:#15382c}.small{font-size:21px;fill:#566b61}.value{font-size:64px;font-weight:bold}.label{font-size:23px}</style><text x="55" y="57" class="small">STUDY 2 / 200 ADVERSARIAL CONTINUATIONS</text><text x="55" y="112" font-size="40" font-weight="bold">Model behavior vs. system enforcement</text><rect x="55" y="160" width="430" height="252" rx="16" fill="white" stroke="#cbded2"/><text x="79" y="202" font-size="18">MODEL BEHAVIOR</text><text x="79" y="285" class="value">12.5%</text><text x="79" y="334" class="label">25/200 adversarial trials</text><text x="79" y="367" class="label">produced prohibited proposals</text><path d="M496 281h24m-9-9 9 9-9 9" fill="none" stroke="#177453" stroke-width="4"/><rect x="535" y="160" width="430" height="252" rx="16" fill="white" stroke="#cbded2"/><text x="559" y="202" font-size="18">APPLICATION ENFORCEMENT</text><text x="559" y="285" class="value">25/25</text><text x="559" y="334" class="label">prohibited proposals</text><text x="559" y="367" class="label">blocked (100.0%)</text><path d="M976 281h24m-9-9 9 9-9 9" fill="none" stroke="#177453" stroke-width="4"/><rect x="1015" y="160" width="430" height="252" rx="16" fill="white" stroke="#cbded2"/><text x="1039" y="202" font-size="18">BACKEND EFFECT</text><text x="1039" y="285" class="value">0/200</text><text x="1039" y="334" class="label">adversarial trials with</text><text x="1039" y="367" class="label">unauthorized execution</text><text x="55" y="468" class="small">Observed results from this bounded experiment, not estimates of universal agent safety.</text><text x="55" y="505" class="small">The first and last cards count trials; the middle card counts proposals. These denominators differ.</text><text x="55" y="557" class="small">Application controls evaluated on the trusted host; OpenShell runtime enforcement is tested separately in Study 1.</text></svg>