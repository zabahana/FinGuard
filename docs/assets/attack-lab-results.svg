<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fafcf9"/><g font-family="Arial,sans-serif"><text x="45" y="50" font-size="16" fill="#246548" font-weight="600">FINGUARD ATTACK LAB / CONTROL ABLATION</text><text x="45" y="105" font-size="36" fill="#163425" font-weight="700">Different controls stopped different failures.</text><text x="45" y="148" font-size="21" fill="#617168" font-weight="400">18 deterministic fixtures per configuration. Three model trials reported separately.</text><text x="465" y="215" font-size="23" fill="#163425" font-weight="700">Unchecked</text><text x="660" y="215" font-size="23" fill="#163425" font-weight="700">FinGuard</text><text x="855" y="215" font-size="23" fill="#163425" font-weight="700">OpenShell</text><text x="1050" y="215" font-size="23" fill="#163425" font-weight="700">Both</text><text x="45" y="255" font-size="18" fill="#617168" font-weight="400">Observed denied / attempted</text><path d="M45 337H1150" stroke="#d4e0d6"/><text x="45" y="310" font-size="24" fill="#243d31" font-weight="400">Application abuse</text><text x="465" y="310" font-size="27" fill="#163425" font-weight="700">0 / 7</text><text x="660" y="310" font-size="27" fill="#163425" font-weight="700">7 / 7</text><text x="855" y="310" font-size="27" fill="#163425" font-weight="700">0 / 7</text><text x="1050" y="310" font-size="27" fill="#163425" font-weight="700">7 / 7</text><path d="M45 412H1150" stroke="#d4e0d6"/><text x="45" y="385" font-size="24" fill="#243d31" font-weight="400">Filesystem attacks</text><text x="465" y="385" font-size="27" fill="#163425" font-weight="700">0 / 4</text><text x="660" y="385" font-size="27" fill="#163425" font-weight="700">0 / 4</text><text x="855" y="385" font-size="27" fill="#163425" font-weight="700">4 / 4</text><text x="1050" y="385" font-size="27" fill="#163425" font-weight="700">4 / 4</text><path d="M45 487H1150" stroke="#d4e0d6"/><text x="45" y="460" font-size="24" fill="#243d31" font-weight="400">Network attacks</text><text x="465" y="460" font-size="27" fill="#163425" font-weight="700">0 / 3</text><text x="660" y="460" font-size="27" fill="#163425" font-weight="700">0 / 3</text><text x="855" y="460" font-size="27" fill="#163425" font-weight="700">3 / 3</text><text x="1050" y="460" font-size="27" fill="#163425" font-weight="700">3 / 3</text><text x="45" y="535" font-size="23" fill="#243d31" font-weight="400">Legitimate controls allowed</text><text x="465" y="535" font-size="27" fill="#163425" font-weight="700">4 / 4</text><text x="660" y="535" font-size="27" fill="#163425" font-weight="700">4 / 4</text><text x="855" y="535" font-size="27" fill="#163425" font-weight="700">4 / 4</text><text x="1050" y="535" font-size="27" fill="#163425" font-weight="700">4 / 4</text><rect x="45" y="582" width="1110" height="105" rx="5" fill="#193f2d"/><text x="70" y="623" font-size="27" fill="#ffffff" font-weight="700">Combined: 14/14 attack fixtures blocked · 4/4 legitimate controls allowed</text><text x="70" y="660" font-size="21" fill="#dcece1" font-weight="400">72/72 deterministic outcomes matched expectations; no inconclusive outcomes in this run.</text><text x="45" y="742" font-size="25" fill="#163425" font-weight="700">Two evidence paths — do not splice them into one attack</text><text x="45" y="787" font-size="16" fill="#246548" font-weight="600">MODEL-DRIVEN APPLICATION PATH</text><text x="45" y="825" font-size="23" fill="#243d31" font-weight="400">Injected wrong transaction → Qwen risk_score request → FinGuard scope denial</text><text x="45" y="861" font-size="20" fill="#617168" font-weight="400">No banking action executed; no downstream runtime attack or OCSF denial claimed.</text><text x="45" y="914" font-size="16" fill="#246548" font-weight="600">DIRECT RUNTIME PATH</text><text x="45" y="952" font-size="23" fill="#243d31" font-weight="400">Direct POST /collect on port 18082 → OpenShell denial → native OCSF event</text><text x="45" y="988" font-size="20" fill="#617168" font-weight="400">Bypasses FinGuard; controlled receiver confirms the denied request did not arrive.</text><text x="45" y="1050" font-size="19" fill="#617168" font-weight="400">Scope: deliberately permissive unchecked adapter; synthetic acceptance, not real bank actions.</text><text x="45" y="1083" font-size="19" fill="#617168" font-weight="400">No LLM in the ablation. Plain Docker remains in baselines. This is not a population safety estimate.</text><text x="45" y="1136" font-size="17" fill="#617168" font-weight="400">Source: saved Attack Lab run 2026-10-03T23:41:06.907507+00:00</text></g></svg>