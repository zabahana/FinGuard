[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard"
version = "0.1.0"
description = "Synthetic financial-agent containment and semantic-policy testbed"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
fraud = ["scikit-learn>=1.5,<2", "pandas>=2.2,<3"]

[project.scripts]
finguard = "finguard.__main__:main"

[tool.setuptools.packages.find]
include = ["finguard*"]

[tool.setuptools.package-data]
finguard = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]
